<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>
  <link rel="stylesheet" href="css/qrcode.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

</head>
<body>
  <main class="qrMain">
	<div class="actualImage">
      <img src="./images/image-qr-code.png" class="qrCode" alt="QR code to visit Frontend Mentor">
	</div>
    <div class="textDiv">
      <h1 class="heading"> Improve your front-end skills by building projects </h1>

      <p class="headingText"> Scan the QR code to visit Frontend Mentor and take your coding skills to the next level </p>
    </div>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Gelox1209">Chao Sheng Lu</a>.
  </footer>
</body>
</html>
